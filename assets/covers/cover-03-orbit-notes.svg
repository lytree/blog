<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Orbit Notes cover">
  <defs>
    <linearGradient id="c3-bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#050b12"/>
      <stop offset="0.5" stop-color="#0a1a28"/>
      <stop offset="1" stop-color="#04080d"/>
    </linearGradient>
    <radialGradient id="c3-glow" cx="0.66" cy="0.44" r="0.58">
      <stop offset="0" stop-color="#49b1f5" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#00c4b6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00c4b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c3-planet" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#b9f4ec"/>
      <stop offset="0.22" stop-color="#63cbd8"/>
      <stop offset="0.55" stop-color="#2b7189"/>
      <stop offset="0.82" stop-color="#123543"/>
      <stop offset="1" stop-color="#0a1c26"/>
    </radialGradient>
    <linearGradient id="c3-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fffb" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#9fdcff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#9fdcff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="c3-sat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9c4"/>
      <stop offset="0.4" stop-color="#ff7242"/>
      <stop offset="1" stop-color="#ff7242" stop-opacity="0"/>
    </radialGradient>
    <pattern id="c3-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#9fdcff" opacity="0.18"/>
    </pattern>
    <filter id="c3-blur50" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="c3-blur12" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="c3-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.072"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#c3-bg)"/>
  <rect width="1200" height="900" fill="url(#c3-glow)"/>

  <!-- 细网格 -->
  <g stroke="#9fdcff" stroke-opacity="0.045" stroke-width="1">
    <path d="M60 0V900M120 0V900M180 0V900M240 0V900M300 0V900M360 0V900M420 0V900M480 0V900M540 0V900M600 0V900M660 0V900M720 0V900M780 0V900M840 0V900M900 0V900M960 0V900M1020 0V900M1080 0V900M1140 0V900"/>
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200M0 420H1200M0 480H1200M0 540H1200M0 600H1200M0 660H1200M0 720H1200M0 780H1200M0 840H1200"/>
  </g>

  <!-- 点阵 -->
  <rect x="110" y="286" width="264" height="216" fill="url(#c3-dots)"/>

  <!-- 轨道 -->
  <g fill="none" transform="rotate(-18 780 410)">
    <ellipse cx="780" cy="410" rx="356" ry="136" stroke="#ff7242" stroke-opacity="0.36" stroke-width="1.4" stroke-dasharray="2 13"/>
    <ellipse cx="780" cy="410" rx="292" ry="106" stroke="#9fdcff" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="1 10"/>
  </g>

  <!-- 星球光晕 -->
  <circle cx="780" cy="410" r="300" fill="#49b1f5" opacity="0.14" filter="url(#c3-blur50)"/>

  <!-- 星球 -->
  <g>
    <circle cx="780" cy="410" r="236" fill="url(#c3-planet)"/>
    <circle cx="780" cy="410" r="236" fill="none" stroke="url(#c3-rim)" stroke-width="1.6"/>
    <g fill="none" stroke="#d6fff8" stroke-opacity="0.1" stroke-width="1">
      <path d="M566 358C690 300 880 316 972 396"/>
      <path d="M560 424C700 372 890 386 986 458"/>
      <path d="M586 500C720 458 880 470 962 526"/>
      <path d="M640 556C740 528 850 534 918 570"/>
    </g>
    <circle cx="780" cy="410" r="236" fill="none" stroke="#0a1c26" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 卫星 -->
  <g transform="rotate(-18 780 410)">
    <circle cx="1132" cy="410" r="24" fill="url(#c3-sat)" opacity="0.45"/>
    <circle cx="1132" cy="410" r="5.5" fill="#ffb08e"/>
  </g>

  <!-- 十字准星 -->
  <g stroke="#9fdcff" stroke-opacity="0.4" fill="none">
    <path d="M226 640h48M250 616v48"/>
    <circle cx="250" cy="640" r="7" stroke-opacity="0.5"/>
    <path d="M1014 186h34M1031 169v34"/>
  </g>

  <!-- 星点 -->
  <g fill="#dcf7ff">
    <circle cx="148" cy="150" r="1.5" opacity="0.5"/>
    <circle cx="286" cy="112" r="1" opacity="0.32"/>
    <circle cx="404" cy="214" r="1.3" opacity="0.42"/>
    <circle cx="522" cy="126" r="1" opacity="0.3"/>
    <circle cx="650" cy="252" r="1.2" opacity="0.34"/>
    <circle cx="912" cy="118" r="1.4" opacity="0.44"/>
    <circle cx="1010" cy="300" r="1" opacity="0.28"/>
    <circle cx="1106" cy="560" r="1.5" opacity="0.42"/>
    <circle cx="954" cy="660" r="1.1" opacity="0.3"/>
    <circle cx="196" cy="720" r="1.3" opacity="0.34"/>
    <circle cx="372" cy="784" r="1" opacity="0.26"/>
    <circle cx="598" cy="700" r="1.2" opacity="0.3"/>
  </g>

  <!-- 数据刻度 -->
  <g stroke="#63e6d3" stroke-opacity="0.25">
    <path d="M64 700h6M64 720h6M64 740h6M64 760h6M64 780h6M64 800h6"/>
    <path d="M1108 620h6M1108 640h6M1108 660h6M1108 680h6"/>
  </g>

  <!-- 画框与角标 -->
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#d7f6ff" stroke-opacity="0.14"/>
  <g stroke="#63e6d3" stroke-opacity="0.75" stroke-width="1.4" fill="none">
    <path d="M28 58V28h30"/>
    <path d="M1172 28v30h-30"/>
    <path d="M28 842v30h30"/>
    <path d="M1172 872v-30h-30"/>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="64" y="86" fill="#c6f4ff" fill-opacity="0.5" font-size="15" letter-spacing="6">N° 03</text>
    <rect x="64" y="814" width="20" height="3" fill="#ff7242"/>
    <text x="98" y="822" fill="#cfeaff" fill-opacity="0.48" font-size="15" letter-spacing="6">LYTREE</text>
  </g>

  <rect width="1200" height="900" filter="url(#c3-grain)" opacity="0.9"/>
</svg>
